<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap');
    </style>
  </defs>

  <!-- Transparent background (no fill) -->

  <!-- Arabic Calligraphy "ذِكْر" -->
  <text x="200" y="200" font-family="'Amiri', serif" font-size="180" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="middle" direction="rtl" xml:lang="ar" letter-spacing="8">
    ذِكْر
  </text>

  <!-- "My.Zikr" text -->
  <text x="200" y="380" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" fill="white" text-anchor="middle" letter-spacing="4">
    My.Zikr
  </text>
</svg>

