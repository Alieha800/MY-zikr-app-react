<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap');
      text { font-feature-settings: "dlig" 1, "liga" 1; }
    </style>
  </defs>

  <!-- Dark green background (#0f2f2c) -->
  <rect width="400" height="400" fill="#0f2f2c"/>

  <!-- Arabic Calligraphy "ذِكْر" using Scheherazade font for better rendering -->
  <text x="200" y="170" font-family="'Scheherazade New', 'Amiri', serif" font-size="150" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="central" direction="rtl" xml:lang="ar">
    ذِكْر
  </text>

  <!-- "My.Zikr" text in refined white serif font -->
  <text x="200" y="310" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" fill="white" text-anchor="middle" letter-spacing="3">
    My.Zikr
  </text>
</svg>

