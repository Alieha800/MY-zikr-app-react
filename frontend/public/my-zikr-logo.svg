<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark green to navy gradient background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D3B2E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0B1E3A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGradient)"/>
  
  <!-- Arabic Calligraphy "ذِكْر" -->
  <text x="200" y="180" font-family="Amiri, serif" font-size="120" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="middle">
    ذِكْر
  </text>
  
  <!-- App Name "My.Zikr" -->
  <text x="200" y="280" font-family="Inter, Poppins, sans-serif" font-size="32" font-weight="300" fill="white" text-anchor="middle" letter-spacing="2">
    My.Zikr
  </text>
</svg>

