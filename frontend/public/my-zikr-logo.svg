<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap');
    </style>
  </defs>

  <!-- Dark green background (#0f2f2c) -->
  <rect width="400" height="400" fill="#0f2f2c"/>

  <!-- Arabic Calligraphy "ذِكْر" using actual text -->
  <text x="200" y="160" font-family="Amiri, serif" font-size="140" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="middle" direction="rtl">
    ذِكْر
  </text>

  <!-- "My.Zikr" text in refined white serif font -->
  <text x="200" y="310" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" fill="white" text-anchor="middle" letter-spacing="3">
    My.Zikr
  </text>
</svg>

