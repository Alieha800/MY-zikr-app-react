<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap');
    </style>
  </defs>

  <!-- White background circle -->
  <circle cx="60" cy="60" r="58" fill="white" stroke="#0D3B2E" stroke-width="4"/>

  <!-- Arabic Calligraphy "ذِكْر" in white -->
  <text x="60" y="65" font-family="'Amiri', serif" font-size="48" font-weight="700" fill="#0D3B2E" text-anchor="middle" dominant-baseline="middle" direction="rtl" xml:lang="ar" letter-spacing="2">
    ذِكْر
  </text>
</svg>

